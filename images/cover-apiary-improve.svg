  <line x1="684" y1="154" x2="1104" y2="154" stroke="#253044" stroke-width="1"/>

  <text x="684" y="177" font-family="Menlo, 'Courier New', monospace"
        font-size="11" letter-spacing="1.2" fill="#5C687C">STEP</text>
  <text x="1104" y="177" text-anchor="end" font-family="Menlo, 'Courier New', monospace"
