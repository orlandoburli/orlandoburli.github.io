<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0D14"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="315" rx="430" ry="360" fill="url(#glow)"/>

  <!-- ── left: title block ───────────────────────────────────────────── -->

  <!-- hex mark -->
  <path d="M76 138 l11 6.35 v12.7 l-11 6.35 -11 -6.35 v-12.7 z"
        fill="none" stroke="#F5A524" stroke-width="2"/>
  <circle cx="76" cy="151" r="3" fill="#F5A524"/>

  <text x="106" y="157" font-family="Menlo, 'Courier New', monospace"
        font-size="15" letter-spacing="2.2" fill="#F5A524">APIARY v0.14.0</text>

  <text x="72" y="248" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="55" font-weight="700" fill="#F1F5F9" letter-spacing="-1">Asking the pipeline</text>
  <text x="72" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="55" font-weight="700" fill="#F1F5F9" letter-spacing="-1">how it's doing</text>

  <rect x="72" y="350" width="200" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="72" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" fill="#8A97AB">Every number is computed before a model</text>
  <text x="72" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" fill="#8A97AB">is ever asked for an opinion.</text>

  <text x="72" y="536" font-family="Menlo, 'Courier New', monospace"
        font-size="15" fill="#5C687C">$ apiary improve --dump-evidence</text>
  <text x="72" y="566" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" fill="#4A5568">orlandoburli.com.br</text>

  <!-- ── right: evidence pack panel ──────────────────────────────────── -->

  <rect x="660" y="96" width="468" height="438" rx="14" fill="#131A27" stroke="#253044" stroke-width="1"/>

  <text x="684" y="137" font-family="Menlo, 'Courier New', monospace"
        font-size="13" letter-spacing="1.6" fill="#8A97AB">EVIDENCE PACK</text>
  <text x="1104" y="137" text-anchor="end" font-family="Menlo, 'Courier New', monospace"
