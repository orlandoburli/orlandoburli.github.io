  <!-- row 1 — spec -->
  <text x="684" y="211" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#B7C2D2">spec</text>
  <rect x="800" y="200" width="23" height="10" rx="5" fill="#5B9CF8"/>
  <text x="1104" y="211" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#8A97AB">$0.42</text>

  <!-- row 2 — implement -->
  <text x="684" y="257" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#B7C2D2">implement</text>
  <rect x="800" y="246" width="168" height="10" rx="5" fill="#5B9CF8"/>
  <text x="1104" y="257" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#8A97AB">$3.10</text>

  <!-- row 3 — review (flagged: ran twice) -->
  <rect x="672" y="284" width="444" height="48" rx="8" fill="#F5A524" fill-opacity="0.07"/>
  <text x="684" y="303" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#F5A524">review</text>
  <rect x="800" y="292" width="99" height="10" rx="5" fill="#F5A524"/>
  <rect x="901" y="292" width="99" height="10" rx="5" fill="#F5A524" fill-opacity="0.45"/>
  <text x="1104" y="303" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#F5A524">$3.70</text>
  <text x="800" y="325" font-family="Menlo, 'Courier New', monospace" font-size="12" fill="#C98C1E">&#215;2 &#8212; rework loop, billed twice</text>

  <!-- row 4 — check-ci -->
  <text x="684" y="357" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#B7C2D2">check-ci</text>
  <rect x="800" y="346" width="13" height="10" rx="5" fill="#5B9CF8"/>
  <text x="1104" y="357" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#8A97AB">$0.24</text>

  <!-- row 5 — qa -->
  <text x="684" y="403" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#B7C2D2">qa</text>
  <rect x="800" y="392" width="52" height="10" rx="5" fill="#5B9CF8"/>
  <text x="1104" y="403" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#8A97AB">$0.96</text>

  <!-- row 6 — merge -->
  <text x="684" y="449" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#B7C2D2">merge</text>
  <rect x="800" y="438" width="6" height="10" rx="3" fill="#5B9CF8"/>
  <text x="1104" y="449" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="14" fill="#8A97AB">$0.11</text>

  <line x1="684" y1="478" x2="1104" y2="478" stroke="#253044" stroke-width="1"/>
  <text x="684" y="506" font-family="Menlo, 'Courier New', monospace" font-size="13" fill="#5C687C">1 finding</text>
  <text x="1104" y="506" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="13" fill="#5C687C">patch validated &#8212; 5/5 gates</text>
